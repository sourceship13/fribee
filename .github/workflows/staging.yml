name: Build and Deploy Staging

on:
  push:
    branches:
      - main
      - develop
      - circle

jobs:
  build_android:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      FRIBEE_NPM_TOKEN: ${{ secrets.FRIBEE_NPM_TOKEN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ENV_STAGING_BASE64: ${{ secrets.ENV_STAGING_BASE64 }}
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm

      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${FRIBEE_NPM_TOKEN}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc

      - name: Install Node.js dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v2-gradle-${{ hashFiles('android/build.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            v2-gradle-

      - name: Cache Ruby gems
        uses: actions/cache@v4
        with:
          path: android/vendor/bundle
          key: v3-android-gems-${{ hashFiles('android/Gemfile.lock') }}
          restore-keys: |
            v3-android-gems-

      - name: Install Ruby dependencies
        run: |
          cd android
          rm -rf .bundle vendor/bundle
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install CMake
        run: echo "y" | sdkmanager "cmake;3.22.1"

      - name: Decode Android Keystore
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/fribee-release.keystore
            echo "✅ Keystore decoded successfully"
          else
            echo "⚠️  ANDROID_KEYSTORE_BASE64 not found - builds will fail at signing step"
            echo "Add the keystore as a base64 repository secret"
            exit 1
          fi

      - name: Decode .env.staging file
        run: |
          if [ -n "$ENV_STAGING_BASE64" ]; then
            echo "$ENV_STAGING_BASE64" | base64 --decode > .env.staging
            echo "✅ .env.staging decoded successfully"
          else
            echo "⚠️  ENV_STAGING_BASE64 not found - builds will fail"
            echo "Add the .env.staging file as a base64 repository secret"
            exit 1
          fi

      - name: Build Android Staging (APK & AAB)
        run: |
          cp .env.staging .env
          cd android
          rm -rf .gradle app/.cxx app/build ~/.gradle/caches
          export CI=true
          export SENTRY_DISABLE_AUTO_UPLOAD=true
          export ENVFILE=.env.staging
          ./gradlew generateCodegenArtifactsFromSchema --no-daemon
          mkdir -p ../node_modules/react-native-config/android/build/generated/source/codegen/jni
          ./gradlew assembleStagingRelease --no-daemon --stacktrace
          ./gradlew bundleStagingRelease --no-daemon --stacktrace

      - name: Build Android Production (APK & AAB)
        run: |
          cp .env.production .env
          cd android
          export ENVFILE=.env.production
          ./gradlew assembleProductionRelease --no-daemon --stacktrace
          ./gradlew bundleProductionRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: android-staging
          path: |
            android/app/build/outputs/apk/staging/release/app-staging-release.apk
            android/app/build/outputs/bundle/stagingRelease/app-staging-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: android-production
          path: |
            android/app/build/outputs/apk/production/release/app-production-release.apk
            android/app/build/outputs/bundle/productionRelease/app-production-release.aab

  build_ios_staging:
    runs-on: macos-15
    env:
      NODE_ENV: development
      FRIBEE_NPM_TOKEN: ${{ secrets.FRIBEE_NPM_TOKEN }}
      ENV_STAGING_BASE64: ${{ secrets.ENV_STAGING_BASE64 }}
      MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      FL_OUTPUT_DIR: output
    defaults:
      run:
        shell: /bin/bash --login -o pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm

      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${FRIBEE_NPM_TOKEN}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc

      - name: Install Node.js dependencies
        run: npm ci

      - name: Disable Sentry uploads completely
        run: |
          cat > node_modules/@sentry/cli/js/helper.js << 'EOF'
          module.exports = {
            execute: function() { return Promise.resolve(); },
            getPath: function() { return '/usr/bin/true'; }
          };
          EOF
          echo "✅ Disabled @sentry/cli"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          working-directory: ios
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods
          key: v1-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            v1-pods-

      - name: Install CocoaPods
        run: |
          cd ios
          bundle exec pod repo update
          bundle exec pod install

      - name: Setup SSH and Keychain for Match
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          cat > ~/.ssh/config << 'EOF'
          Host github.com-fastlane-match
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking no
          EOF

          KEYCHAIN_PATH=~/Library/Keychains/fastlane.keychain-db
          KEYCHAIN_PASSWORD=temp_password

          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)

          echo "✅ Keychain setup complete"

      - name: Strip bitcode from Hermes
        run: |
          cd ios
          HERMES_FRAMEWORK="Pods/hermes-engine/destroot/Library/Frameworks/universal/hermes.framework/hermes"
          if [ -f "$HERMES_FRAMEWORK" ]; then
            echo "Stripping bitcode from Hermes..."
            xcrun bitcode_strip -r "$HERMES_FRAMEWORK" -o "$HERMES_FRAMEWORK"
            echo "✅ Bitcode stripped successfully"
          else
            echo "⚠️ Hermes framework not found at expected location"
            find Pods -name "hermes.framework" -type d
          fi

      - name: Clear Metro bundler cache
        run: |
          echo "Clearing Metro bundler cache..."
          rm -rf "$TMPDIR"/metro-* "$TMPDIR"/haste-* "$TMPDIR"/react-* 2>/dev/null || true
          rm -rf ~/.metro 2>/dev/null || true
          echo "✅ Metro cache cleared"

      - name: Pre-bundle React Native code
        run: |
          echo "Pre-bundling React Native code to check for errors..."
          export NODE_BINARY=node
          export ENTRY_FILE=index.js
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/test-bundle.js \
            --assets-dest /tmp/test-assets \
            --reset-cache
          echo "✅ Pre-bundle successful"

      - name: Decode .env.staging file
        run: |
          if [ -n "$ENV_STAGING_BASE64" ]; then
            echo "$ENV_STAGING_BASE64" | base64 --decode > .env.staging
            echo "✅ .env.staging decoded successfully"
          else
            echo "⚠️  ENV_STAGING_BASE64 not found - builds will fail"
            echo "Add the .env.staging file as a base64 repository secret"
            exit 1
          fi

      - name: Build and upload to TestFlight (Staging)
        run: |
          cp .env.staging .env
          export ENVFILE=.env.staging
          cd ios
          bundle exec fastlane staging

      - name: Display App Version and Build Number
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" ios/fribee/Info.plist)
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" ios/fribee/Info.plist)
          echo "Staging App Version: $APP_VERSION"
          echo "Staging Build Number: $BUILD_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-staging-build
          path: ios/build
