name: Deploy Production

on:
  push:
    branches:
      - main
      - circle
    tags:
      - "v*"

jobs:
  build_ios_production:
    runs-on: macos-15
    env:
      NODE_ENV: development
      FRIBEE_NPM_TOKEN: ${{ secrets.FRIBEE_NPM_TOKEN }}
      MATCH_SSH_PRIVATE_KEY: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      FL_OUTPUT_DIR: output
    defaults:
      run:
        shell: /bin/bash --login -o pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          cache: npm

      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${FRIBEE_NPM_TOKEN}" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc

      - name: Install Node.js dependencies
        run: npm ci

      - name: Disable Sentry uploads completely
        run: |
          cat > node_modules/@sentry/cli/js/helper.js << 'EOF'
          module.exports = {
            execute: function() { return Promise.resolve(); },
            getPath: function() { return '/usr/bin/true'; }
          };
          EOF
          echo "✅ Disabled @sentry/cli"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          working-directory: ios
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods
          key: v1-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            v1-pods-

      - name: Install CocoaPods
        run: |
          cd ios
          bundle exec pod repo update
          bundle exec pod install

      - name: Setup SSH and Keychain for Match
        run: |
          mkdir -p ~/.ssh
          echo "$MATCH_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          cat > ~/.ssh/config << 'EOF'
          Host github.com-fastlane-match
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking no
          EOF

          KEYCHAIN_PATH=~/Library/Keychains/fastlane.keychain-db
          KEYCHAIN_PASSWORD=temp_password

          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)

          echo "✅ Keychain setup complete"

      - name: Strip bitcode from Hermes
        run: |
          cd ios
          HERMES_FRAMEWORK="Pods/hermes-engine/destroot/Library/Frameworks/universal/hermes.framework/hermes"
          if [ -f "$HERMES_FRAMEWORK" ]; then
            echo "Stripping bitcode from Hermes..."
            xcrun bitcode_strip -r "$HERMES_FRAMEWORK" -o "$HERMES_FRAMEWORK"
            echo "✅ Bitcode stripped successfully"
          else
            echo "⚠️ Hermes framework not found at expected location"
            find Pods -name "hermes.framework" -type d
          fi

      - name: Clear Metro bundler cache
        run: |
          echo "Clearing Metro bundler cache..."
          rm -rf "$TMPDIR"/metro-* "$TMPDIR"/haste-* "$TMPDIR"/react-* 2>/dev/null || true
          rm -rf ~/.metro 2>/dev/null || true
          echo "✅ Metro cache cleared"

      - name: Pre-bundle React Native code
        run: |
          echo "Pre-bundling React Native code to check for errors..."
          export NODE_BINARY=node
          export ENTRY_FILE=index.js
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/test-bundle.js \
            --assets-dest /tmp/test-assets \
            --reset-cache
          echo "✅ Pre-bundle successful"

      - name: Build and upload to TestFlight (Production)
        run: |
          cp .env.production .env
          export ENVFILE=.env.production
          cd ios
          bundle exec fastlane production

      - name: Display App Version and Build Number
        run: |
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" ios/fribee/Info.plist)
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" ios/fribee/Info.plist)
          echo "Production App Version: $APP_VERSION"
          echo "Production Build Number: $BUILD_NUMBER"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-production-build
          path: ios/build
